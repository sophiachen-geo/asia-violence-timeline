<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asia, 1945 to 2026 · Conflict and State Violence</title>
    <meta name="description" content="A combined record of armed conflict and political mass violence across Asia since the Second World War. 136 events, 40 countries, eight decades." />

    <!-- Open Graph -->
    <meta property="og:title" content="Asia, 1945 to 2026" />
    <meta property="og:description" content="A combined record of armed conflict and political mass violence across Asia since the Second World War." />
    <meta property="og:type" content="website" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />

    <style>
      html, body { background-color: #0e1118; margin: 0; }
      html[data-theme="light"], html[data-theme="light"] body { background-color: #f5f1e8; }
    </style>
    <script>
      // Pre-React: read persisted theme so the initial paint doesn't flash
      // the wrong colour. useTheme will resync once React mounts.
      try {
        var t = localStorage.getItem('avt-theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
